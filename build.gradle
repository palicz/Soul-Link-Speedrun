plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential Minecraft and Fabric maven repositories automatically.
	// Only third-party mod repositories belong here.
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// Minecraft 26.1 is unobfuscated, so no mappings dependency is required and mod
	// dependencies use the plain implementation/include configurations.
	// See https://docs.fabricmc.net/develop/porting/ for details.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fantasy - runtime world generation library, bundled into the jar via jar-in-jar.
	implementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
